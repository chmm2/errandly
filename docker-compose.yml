services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: errandly
      POSTGRES_PASSWORD: errandly
      POSTGRES_DB: errandly
    ports:
      # 5433 on the host: many devs have a native Postgres already squatting
      # on 5432, and connecting a GUI to the wrong server fails confusingly.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U errandly -d errandly"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
