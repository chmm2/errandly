services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: errandly
      POSTGRES_PASSWORD: errandly
      POSTGRES_DB: errandly
    ports:
      # 5433 on the host: many devs have a native Postgres already squatting
      # on 5432, and connecting a GUI to the wrong server fails confusingly.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U errandly -d errandly"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # MongoDB — chat/messages (polyglot persistence: flexible, write-heavy
  # per-conversation docs that don't fit the relational core).
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Single-node Kafka (KRaft — no ZooKeeper). Containers talk to kafka:19092,
  # tools on the host laptop talk to localhost:9092.
  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  # Social graph. A DERIVED read model, never the source of truth: friendships
  # live in Postgres and are projected here by the social-graph consumer, so
  # this volume can be deleted and rebuilt from the event log at any time.
  neo4j:
    image: neo4j:5.26-community
    ports:
      - "7474:7474" # browser
      - "7687:7687" # bolt
    environment:
      NEO4J_AUTH: neo4j/errandly-dev
      NEO4J_server_memory_heap_max__size: 512M
      # GDS is not installed on purpose: clustering coefficient and degree are
      # computed in plain Cypher below. Add the plugin when the fraud work needs
      # Louvain community detection — it downloads at boot, so an offline start
      # would otherwise fail the whole stack.
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p errandly-dev 'RETURN 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15

  backend:
    build: ./backend
    extra_hosts:
      # Reach a model running on the host (see LLM_PROVIDER=ollama). Docker
      # Desktop provides this name already; a plain Linux daemon does not.
      - "host.docker.internal:host-gateway"
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mongo:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Outbox relay: polls unpublished outbox rows, publishes to Kafka.
  relay:
    build: ./backend
    extra_hosts:
      # Reach a model running on the host (see LLM_PROVIDER=ollama). Docker
      # Desktop provides this name already; a plain Linux daemon does not.
      - "host.docker.internal:host-gateway"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    command: python -m app.workers.relay

  # Notification + analytics consumers (competing-consumer groups) + the
  # timetable enforcer / offer-broadening scheduler.
  workers:
    build: ./backend
    extra_hosts:
      # Reach a model running on the host (see LLM_PROVIDER=ollama). Docker
      # Desktop provides this name already; a plain Linux daemon does not.
      - "host.docker.internal:host-gateway"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    command: python -m app.workers.consumers

volumes:
  pgdata:
  mongodata:
  neo4jdata:
